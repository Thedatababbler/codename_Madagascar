task_id: stage2_pareto_fork_join
plan_version: 1
decomposition_rationale: >
  Deterministic fork/join fixture for Stage-2 Pareto concurrency adaptation.
  s1 seeds; s2 and s3 form a parallel wave; s4 joins.
subtasks:
  - subtask_id: s1
    title: seed
    objective: Produce an initial public answer artifact.
    dependencies: []
    keystone_harness_id: repository_test_harness
    local_graph_template: configs/graphs/codex_single_implementer.yaml
    budget: {}
  - subtask_id: s2
    title: fork-left
    objective: Left branch after Slow Loop concurrency adaptation.
    dependencies: [s1]
    keystone_harness_id: repository_test_harness
    local_graph_template: configs/graphs/codex_single_implementer.yaml
    budget: {}
  - subtask_id: s3
    title: fork-right
    objective: Right branch after Slow Loop concurrency adaptation.
    dependencies: [s1]
    keystone_harness_id: repository_test_harness
    local_graph_template: configs/graphs/codex_single_implementer.yaml
    budget: {}
  - subtask_id: s4
    title: join
    objective: Finalize after both fork branches commit.
    dependencies: [s2, s3]
    keystone_harness_id: repository_test_harness
    local_graph_template: configs/graphs/codex_single_implementer.yaml
    budget: {}
communication_plan:
  version: 1
  payload_contracts:

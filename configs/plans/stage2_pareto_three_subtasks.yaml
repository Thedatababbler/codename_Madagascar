      required: false
      max_tokens: 4096
      metadata: {slot: "comm:p24"}
    - payload_id: p34
      source_subtask_id: s3
      target_subtask_id: s4
      artifact_type: FinalAnswerArtifact
      required: false
      max_tokens: 4096
      metadata: {slot: "comm:p34"}
  delivery_schedule:
    - rule_id: r12
      payload_id: p12
      enabled: true
    - rule_id: r13
      payload_id: p13
      enabled: true
    - rule_id: r24
      payload_id: p24
      enabled: true
    - rule_id: r34

# NL2Repo series on gpt-5.6-sol (zqin30), 2026-10-01: three training tasks (tablib, tenacity, python-jose).
# Run with ADAMAS_EVOLUTION_ROOT=outputs/nl2sol_evolution_state so the ledger / bank / cycles stay apart from the CPE gpt-5.5 series.
# Self-evolution run (adamas_milestone_self_evolution_prompt.md §10): the milestones
# arm plus the standard procedure -- adaptive probes budgeted apart, R0 always run,
# unified per-case acceptance, prior-suite regression check, repair slot on failures.
# Everything below the tuning block is read only when evolution.enabled is true.
# Continuation arm: persistence search whose phase two drafts the
# continuation candidate first -- one diagnosed specialist replayed onto the
# incumbent's own change set, told only the persistent failures. Three tasks
# recorded as likely to trigger the quality search (imapclient, pyjwt,
# bplustree; simpy is on record as never firing at 0.9), frozen test_first
# plans from outputs/cpe_54_search/plans. Own results directory.
experiment:
  name: nl2repo_milestones_evolution
  benchmark: codeprojecteval
  agent_backend: codex_sdk
  dataset_root: /root/codex-benchmarks/nl2repo/cpe_format
  contracts_dir: configs/contracts
  output_root: outputs/nl2sol_evolution
  harness_timeout_seconds: 900
  seed: 20260814

  tuning:
    playbook_search: false
    design_search: false
    persistence_search: true
    persistence_probe_samples: 2
    node_resample_n: 3
    persistence_after_recovery: true
    refuse_zero_commit_over_base: true
    fast_loop_candidates: 3
    diagnosis:
      mode: llm
      min_confidence: 0.5
      # model: (unset) -- follows DIAGNOSIS_MODEL / CODEX_MODEL; a literal pin here outlived gpt-5.4 by four days
    quality_trigger:
      enabled: true
      min_score: 0.9
    pareto:
      rule: quality_first
      epsilon:
        quality: 0.02
        cost: 0.08
        stability: 0.0
      require_gate_pass: true
    gate_weight: 1.0
    harness_weight: 0.5
    token_weight: 0.05
    token_reference: 1000000
    allow_cost_to_outrank_gate: false

decomposition:
  dynamic_planner: true
  min_subtasks: 1
  max_subtasks: 5
  split_policy: feature
  max_dependency_depth: 6
  require_public_keystone_harness: true

runtime:
  max_parallel_nodes_per_task: 2

pareto:
  enabled: false

slow_loop:
  enabled: false

fast_loop:
  max_candidates: 0

logging:
  level: INFO

# --- self-evolution (top-level blocks, §10) ---------------------------------
evolution:
  enabled: true
  split_file: configs/datasets/evolution_split.yaml
  repair_trigger: failures      # gate | failures
probes:
  default: 2
  adaptive: true
  flaky_extra_threshold: 3
budget:
  mode: B                       # A: R0 + 1 active + 1 trial; B: R0 + 1 slot
  probes_separate: true
acceptance:
  unified: true
  prior_suite_check: true
trial:
  prob: 0.3
  max_concurrent: 2
ranking:
  n0: 3
promotion:
  m: 5
thr:
  e1_files: 6
  f2: 5
  f3: 3
  f5: 8
  f5s: 20
  f6: 4
bank:
  success_sample_rate: 0.2
  min_per_class: 3
rerun:
  reps: 2
  max_runs_per_cycle: 12
  concurrency: 2
  f_success_share: 0.3
  cost_tolerance: 0.15
  m_f: 5
cycle:
  batch_tasks: 6
  buffer_failures: 12
evolver:
  max_proposals: 3
tripwire:
  tolerance: 2.0
replay:
  min_class_samples: 5

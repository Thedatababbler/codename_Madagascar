experiment:
  name: codeprojecteval_official_search_min093
  benchmark: codeprojecteval
  agent_backend: codex_sdk
  dataset_root: /root/codex-benchmarks/projectgen/datasets/CodeProjectEval/python-subset
  contracts_dir: configs/contracts
  output_root: outputs/cpe_official
  harness_timeout_seconds: 900
  seed: 20260814

  # Same as official_search, except the quality trigger is high enough to
  # search a ~0.93 first pass. The check is strictly less-than, so 0.930
  # does not fire at min_score 0.93; 0.94 is the bar that matches the ask.
  tuning:
    fast_loop_candidates: 2
    design_search: true
    quality_trigger:
      enabled: true
      min_score: 0.94
    pareto:
      rule: quality_first
      epsilon:
        quality: 0.02
        cost: 0.08
        stability: 0.0
      require_gate_pass: true
    gate_weight: 1.0
    harness_weight: 0.5
    token_weight: 0.05
    token_reference: 1000000
    allow_cost_to_outrank_gate: false

decomposition:
  dynamic_planner: true
  min_subtasks: 1
  max_subtasks: 4
  max_dependency_depth: 4
  require_public_keystone_harness: true

runtime:
  max_parallel_nodes_per_task: 2

pareto:
  enabled: false

slow_loop:
  enabled: false

fast_loop:
  max_candidates: 0

logging:
  level: INFO

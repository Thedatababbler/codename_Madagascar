experiment:
  name: codeprojecteval_tuning
  benchmark: codeprojecteval
  # Risk-first dynamic milestones only. There is no template fallback on this
  # dataset: a run whose planner is unavailable fails instead of silently
  # measuring a shape-based split.
  agent_backend: codex_sdk
  dataset_root: /root/codex-benchmarks/projectgen/datasets/CodeProjectEval/python-subset
  contracts_dir: configs/contracts
  output_root: outputs/cpe_tuning
  # A milestone gate runs the repository's own visible check_tests, which is
  # slower than an import sweep.
  harness_timeout_seconds: 900
  seed: 20260808

  # Tuning happens inside the fast loop, one milestone at a time. When a
  # milestone's gate has run, everything the loop needs is already known -- it
  # does not wait for the repository to be scored, and it must not: the held-out
  # suite is not visible at that point and tuning on it would be tuning on the
  # test set.
  #
  # Off by default. A repair loop that fires in one A/B arm and not the other
  # gets measured as part of that arm, so the comparison runs turn it off and
  # tuning runs turn it on deliberately.
  tuning:
    # Design candidates per failed milestone. Each one re-runs the milestone from
    # the last committed snapshot, which on the measured repositories is ~13 min
    # and ~$1.50, so this number multiplies a run's duration directly. Three is
    # the first value that can show whether the frontier carries information:
    # an anchor that only receives the failure report, plus two design edits.
    fast_loop_candidates: 3
    # One atomic edit per candidate, and the trade-offs between them kept as a
    # frontier instead of collapsed into a weighted sum. Off, candidates vary
    # only retry parameters, and the effective candidate count is two whatever
    # is configured here.
    design_search: true
    pareto:
      # quality_first commits the best-scoring point on the frontier;
      # balanced_knee can prefer a much cheaper near-miss.
      rule: quality_first
      # A difference smaller than the measurement's own resolution must not
      # decide anything. Calibrated for candidates costing $1-2; see
      # docs/fast_loop_pareto_protocol.md for the derivation of each.
      epsilon:
        # One unit of the coarsest weighted harness stage rounds to ~0.01.
        quality: 0.02
        # ~5% of an observed candidate's cost.
        cost: 0.08
        # Integer incident counts: one more incident is a real difference.
        stability: 0.0
    # The weighted scalar below is only consulted when design_search is off, or
    # as the fallback when the frontier yields nothing to commit.
    gate_weight: 1.0
    harness_weight: 0.5
    token_weight: 0.05
    token_reference: 1000000
    allow_cost_to_outrank_gate: false

decomposition:
  dynamic_planner: true
  min_subtasks: 1
  max_subtasks: 4
  max_dependency_depth: 4
  require_public_keystone_harness: true

runtime:
  max_parallel_nodes_per_task: 2

pareto:
  enabled: false

slow_loop:
  enabled: false

fast_loop:
  max_candidates: 0

logging:
  level: INFO

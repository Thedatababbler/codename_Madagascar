# All-anchor control arm for playbook search: fast_loop_candidates identical
# anchor designs (failure report + fresh session), resampled, under the same
# Pareto selector. Two questions it answers that no playbook run can: whether
# best-of-k resampling matches playbook search at the same k (if yes, the
# table buys nothing at this budget), and the same-design noise floor sigma,
# which is what epsilon.quality must be calibrated against. Own results
# directory: candidates come from a different rule, so no shared tables.
experiment:
  name: codeprojecteval_official_anchor
  benchmark: codeprojecteval
  agent_backend: codex_sdk
  dataset_root: /root/codex-benchmarks/projectgen/datasets/CodeProjectEval/python-subset
  contracts_dir: configs/contracts
  output_root: outputs/cpe_official_anchor
  harness_timeout_seconds: 900
  seed: 20260814

  tuning:
    playbook_search: false
    design_search: false
    anchor_search: true
    fast_loop_candidates: 3
    diagnosis:
      mode: llm
      min_confidence: 0.5
      # model: (unset) -- follows DIAGNOSIS_MODEL / CODEX_MODEL; a literal pin here outlived gpt-5.4 by four days
    quality_trigger:
      enabled: true
      min_score: 0.9
    pareto:
      rule: quality_first
      epsilon:
        quality: 0.02
        cost: 0.08
        stability: 0.0
      require_gate_pass: true
    gate_weight: 1.0
    harness_weight: 0.5
    token_weight: 0.05
    token_reference: 1000000
    allow_cost_to_outrank_gate: false

decomposition:
  dynamic_planner: true
  min_subtasks: 1
  max_subtasks: 4
  max_dependency_depth: 4
  require_public_keystone_harness: true

runtime:
  max_parallel_nodes_per_task: 2

pareto:
  enabled: false

slow_loop:
  enabled: false

fast_loop:
  max_candidates: 0

logging:
  level: INFO

# Formal LiveCodeBench sample: abc309_a with 3 multi-agent subtasks.
# Pareto disabled. Use visualize_task_graphs to inspect graphs before running.
experiment:
  name: lcb_formal_three_subtask_mas
  seed: 42
  graph_config: configs/graphs/lcb_mas_analyze.yaml
  contracts_dir: configs/contracts
  output_root: outputs/lcb_formal_three_subtask_mas
  plan_config: configs/plans/lcb_abc309_a_three_subtasks.yaml

benchmark:
  name: livecodebench
  release_version: release_v6
  scenario: codegeneration
  language: python
  task_id: abc309_a
  manifest: configs/manifests/lcb_smoke.json
  data_dir: /root/data/livecodebench/code_generation_lite
  repository_path: /root/projects/LiveCodeBench

runtime:
  backend: native_async
  max_parallel_benchmark_tasks: 1
  max_parallel_nodes_per_task: 4
  max_parallel_llm_calls: 4
  max_parallel_sandboxes: 2

slow_loop:
  enabled: true
  failure_policy: keep_previous_plan
  every_n_committed_subtasks: 1
  context_pressure_ratio: 0.85
  max_updates_per_task: 3
  max_candidates_per_update: 3

pareto:
  enabled: false

sandbox:
  backend: lcb_official
  per_test_timeout_seconds: 6.0

logging:
  level: INFO
  save_prompts: true
  save_artifacts: true

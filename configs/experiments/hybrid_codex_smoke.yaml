# Deterministic Hybrid Codex smoke (fake AsyncCodex lifecycle).
# Run: uv run python -m orchestra.cli.run_hybrid_codex_smoke
experiment:
  name: hybrid_codex_smoke
  seed: 42
  graph_config: configs/graphs/codex_single_implementer.yaml
  contracts_dir: configs/contracts
  output_root: outputs/hybrid_codex_smoke
  plan_config: configs/plans/codex_tiny_repo_single_subtask.yaml
  source_repo: tests/fixtures/codex_tiny_repo

benchmark:
  name: codex_tiny_repo
  task_id: codex_tiny_repo

runtime:
  backend: native_async
  max_parallel_benchmark_tasks: 1
  max_parallel_nodes_per_task: 2
  max_parallel_llm_calls: 2
  max_parallel_sandboxes: 1

fast_loop:
  codex_session_mode: hybrid
  max_candidates: 3
  max_total_backend_calls: 10
  hybrid_codex:
    enable_resume: true
    enable_fork: true
    missing_parent_policy: reject

logging:
  level: INFO

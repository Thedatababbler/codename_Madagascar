graph_id: b2_fixed_mas
version: "1.0"
initial_artifact_slots:
  problem: ProblemArtifact
final_output_slot: final_code
metadata:
  baseline: B2_FIXED_MAS
nodes:
  - node_id: algorithm_analyst
    node_kind: agent
    contract_id: algorithm_analyst
    input_slots: {problem: ProblemArtifact}
    output_slots: {plan: AlgorithmPlanArtifact}
  - node_id: edge_case_analyst
    node_kind: agent
    contract_id: edge_case_analyst
    input_slots: {problem: ProblemArtifact}
    output_slots: {edge_cases: EdgeCaseArtifact}
  - node_id: plan_merger
    node_kind: transform
    transform_id: merge_analysis_artifacts
    input_slots:
      plan: AlgorithmPlanArtifact
      edge_cases: EdgeCaseArtifact
    output_slots: {combined_plan: CombinedPlanArtifact}
  - node_id: solution_coder
    node_kind: agent
    contract_id: solution_coder
    input_slots:
      problem: ProblemArtifact
      combined_plan: CombinedPlanArtifact
    output_slots: {code: CodeArtifact}
  - node_id: public_harness_initial
    node_kind: harness
    harness_id: public_code_harness
    visibility: public
    input_slots: {problem: ProblemArtifact, code: CodeArtifact}
    output_slots: {result: PublicHarnessResultArtifact}
  - node_id: freeze_initial
    node_kind: transform
    transform_id: freeze_code
    input_slots: {code: CodeArtifact, gate: PublicHarnessResultArtifact}
    output_slots: {final_code: FinalCodeArtifact}
  - node_id: repair_agent
    node_kind: agent
    contract_id: repair_agent
    input_slots:
      problem: ProblemArtifact
      combined_plan: CombinedPlanArtifact
      previous_code: CodeArtifact
      public_result: PublicHarnessResultArtifact
    output_slots: {repair: RepairArtifact}
  - node_id: repair_to_code
    node_kind: transform
    transform_id: repair_to_code
    input_slots: {repair: RepairArtifact}
    output_slots: {code: CodeArtifact}
  - node_id: public_harness_repaired
    node_kind: harness
    harness_id: public_code_harness
    visibility: public
    input_slots: {problem: ProblemArtifact, code: CodeArtifact}
    output_slots: {result: PublicHarnessResultArtifact}
  - node_id: selector
    node_kind: selector
    selector_id: deterministic_code_selector
    input_slots:
      initial_code: CodeArtifact
      initial_result: PublicHarnessResultArtifact
      repaired_code: CodeArtifact
      repaired_result: PublicHarnessResultArtifact
    output_slots: {code: CodeArtifact}
  - node_id: freeze_selected
    node_kind: transform
    transform_id: freeze_code
    input_slots: {code: CodeArtifact}
    output_slots: {final_code: FinalCodeArtifact}
edges:
  - {edge_id: algorithm_to_merge, source_node: algorithm_analyst, source_output: plan, destination_node: plan_merger, destination_input: plan}
  - {edge_id: edge_cases_to_merge, source_node: edge_case_analyst, source_output: edge_cases, destination_node: plan_merger, destination_input: edge_cases}
  - {edge_id: merge_to_coder, source_node: plan_merger, source_output: combined_plan, destination_node: solution_coder, destination_input: combined_plan}
  - {edge_id: coder_to_initial_harness, source_node: solution_coder, source_output: code, destination_node: public_harness_initial, destination_input: code}
  - {edge_id: coder_to_initial_freeze, source_node: solution_coder, source_output: code, destination_node: freeze_initial, destination_input: code}
  - edge_id: initial_pass_to_freeze
    source_node: public_harness_initial
    source_output: result
    destination_node: freeze_initial
    destination_input: gate
    condition: {source_field: passed, operator: is_true}
  - edge_id: initial_no_harness_to_freeze
    source_node: public_harness_initial
    source_output: result
    destination_node: freeze_initial
    destination_input: gate
    condition: {source_field: harness_available, operator: is_false}
  - {edge_id: plan_to_repair, source_node: plan_merger, source_output: combined_plan, destination_node: repair_agent, destination_input: combined_plan}
  - {edge_id: coder_to_repair, source_node: solution_coder, source_output: code, destination_node: repair_agent, destination_input: previous_code}
  - edge_id: initial_fail_to_repair
    source_node: public_harness_initial
    source_output: result
    destination_node: repair_agent
    destination_input: public_result
    condition: {source_field: repair_eligible, operator: is_true}
  - {edge_id: repair_to_conversion, source_node: repair_agent, source_output: repair, destination_node: repair_to_code, destination_input: repair}
  - {edge_id: repaired_code_to_harness, source_node: repair_to_code, source_output: code, destination_node: public_harness_repaired, destination_input: code}
  - {edge_id: initial_code_to_selector, source_node: solution_coder, source_output: code, destination_node: selector, destination_input: initial_code}
  - {edge_id: initial_result_to_selector, source_node: public_harness_initial, source_output: result, destination_node: selector, destination_input: initial_result}
  - {edge_id: repaired_code_to_selector, source_node: repair_to_code, source_output: code, destination_node: selector, destination_input: repaired_code}
  - {edge_id: repaired_result_to_selector, source_node: public_harness_repaired, source_output: result, destination_node: selector, destination_input: repaired_result}
  - {edge_id: selector_to_freeze, source_node: selector, source_output: code, destination_node: freeze_selected, destination_input: code}

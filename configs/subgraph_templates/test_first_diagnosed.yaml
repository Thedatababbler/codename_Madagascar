template_id: test_first_diagnosed
title: Author the tests, implement, then diagnose before repairing
# Reachable by a playbook recompiling a failed `test_first` milestone, not by the
# planner. The shape only pays for itself when the gate has already failed, and
# offering it up front would change how tasks are decomposed as well as how they
# are repaired -- two changes at once, in a run meant to measure one.
planner_selectable: false
when_to_use: >
  `test_first` with the repair pass split in two. The builder cannot see the
  suite by design, so when the gate fails it does not know what it got wrong,
  and the repairer is left to work out which requirement was misread and to fix
  it in the same turn, from failing test names alone. Here a read-only critic
  reads those names first and reports which behaviour the code got wrong, and
  the repairer executes that finding. Both sit behind the failing gate, so a
  milestone that passes first time pays for neither.
slots:
  - id: test_author
    default_role: test_author
    allowed_roles:
      - test_author
  - id: builder
    # Not test_driven_implementer, for the same reason as `test_first`: that
    # role's premise is a suite it can read, and custody takes this one out of
    # the workspace before this slot starts.
    default_role: implementer
    allowed_roles:
      - implementer
      - contract_author
      - integrator
  - id: critic
    default_role: behaviour_critic
    runs_if_gate_failed: true
    allowed_roles:
      - behaviour_critic
      - spec_auditor
      - contract_critic
  # Declared last because the compiler freezes the change of the last agent it
  # instantiates. A read-only critic in that position would hand the acceptance
  # harness an empty diff to grade.
  - id: repairer
    default_role: gate_repairer
    runs_if_gate_failed: true
    allowed_roles:
      - gate_repairer
      - implementer
      - integrator
      - dependency_resolver
edges:
  - from: test_author
    to: builder
  - from: builder
    to: critic
  - from: critic
    to: repairer
early_gate_after: builder

# Widened on 2026-09-01 so a diagnosed role can land: repair/fix/improve
# positions accept the general editing set; the diagnosis, not the slot,
# decides who sits here, and a role it names but the slot refuses is silently
# swallowed at binding.
template_id: chain
title: Sequential chain
extensible: true
when_to_use: >
  Two or three agents edit the same workspace in order, each building on what
  the previous one left. Use when the milestone has distinct kinds of work that
  must happen in a fixed order, such as substrate before behaviour, or
  behaviour before public wiring.
slots:
  # The authored suite is the behavioural measurement instrument: without it
  # the quality axis reads the dataset's visible checks, which recorded runs
  # pass whole, and behaviour is a constant 1.0 (EXP-20260810-05). Every
  # planner-selectable template therefore opens with this slot. Custody wiring
  # keys on the role, so the suite is moved out of the workspace before any
  # writer starts (subgraph_builder), exactly as in `test_first`.
  - id: test_author
    default_role: test_author
    # Optional on purpose, in both directions. At plan time the planner prompt
    # says to always assign it, and required would not enforce that anyway --
    # the parser never synthesises agents. At search time a recompile MUST
    # skip it when the parent had none: _fill_slots fills required slots with
    # their default, and a test_author synthesised mid-search would author a
    # fresh suite and take custody of it, silently swapping the yardstick the
    # incumbent was graded against.
    required: false
    allowed_roles:
      - test_author
  - id: first
    default_role: contract_author
    allowed_roles:
      - contract_author
      - implementer
      - test_driven_implementer
  - id: second
    default_role: implementer
    allowed_roles:
      - implementer
      - test_driven_implementer
      - integrator
      - edge_case_hardener
      - dependency_resolver
      - scope_pruner
  - id: third
    default_role: integrator
    required: false
    allowed_roles:
      - integrator
      - edge_case_hardener
      - dependency_resolver
      - scope_pruner
      - gate_repairer
      - implementer
edges:
  - from: test_author
    to: first
  - from: first
    to: second
  - from: second
    to: third

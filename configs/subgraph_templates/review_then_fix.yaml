template_id: review_then_fix
title: Implement, review, fix
when_to_use: >
  An author implements, a read-only reviewer reports where the result deviates
  from the specification or from a frozen contract, and a third agent acts on
  that report. Use when the milestone's risk is quiet deviation that the
  acceptance gate cannot see — a wrong shape, a moved symbol, a narrowed
  signature — rather than an outright failure.
slots:
  - id: author
    default_role: implementer
    allowed_roles:
      - implementer
      - test_driven_implementer
      - contract_author
  - id: reviewer
    default_role: contract_critic
    allowed_roles:
      - contract_critic
      - spec_auditor
      - behaviour_critic
  - id: fixer
    default_role: gate_repairer
    allowed_roles:
      - gate_repairer
      - implementer
      - integrator
edges:
  - from: author
    to: reviewer
  - from: reviewer
    to: fixer

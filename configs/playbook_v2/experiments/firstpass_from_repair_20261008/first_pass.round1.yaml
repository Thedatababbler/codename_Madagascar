  actions:
  - kind: inventory
    kinds:
    - main_path
    - boundary
    - state_transition
    - error_path
    - integration
    - protocol
  - kind: instruction
    text: Before coding, build an implementation checklist from the supplied behaviour
      inventory and cover every documented externally sourced input path end-to-end.
      Do not implement only the simplest local case. For each documented input form,
      ensure the workflow performs expansion or normalization, classification, validation,
      dispatch to the correct retrieval or access mechanism, optional sublocation
      selection, required metadata checks, documented unsupported/ambiguous/missing-source
      errors, and cleanup of any temporary resources. Preserve the public entry surface
      promised by the documents. Wire the main orchestration through these behaviours
      rather than leaving helper logic unreachable. Where interactive overwrite, reuse,
      skip, or noninteractive modes are documented, implement their full state transitions.
      For failures after partial output or temporary acquisition, track what was newly
      created and clean up only that, while preserving pre-existing user data and
      permissions. Add or update focused checks that exercise local, archive-like,
      remote-like, shorthand, invalid, missing, and unsafe cases using fakes where
      external access would otherwise be needed.
  - kind: template
    template_id: test_first_improve
  - kind: budget
    steps: 2
    seconds: 180

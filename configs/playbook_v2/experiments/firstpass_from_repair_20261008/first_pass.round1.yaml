    value: 9
  - feature: n_public_symbols
    op: '>='
    value: 40
  predicted_error_classes:
  - E5
  actions:
  - kind: inventory
    kinds:
    - boundary
    - error_path
    - integration
    - protocol
    - state_transition
  - kind: instruction
    text: Treat documented public boundaries and documented exceptions as contracts,
      not optional polish. Before finalizing, enumerate each public entry promised
      by the documents and verify it is exported, reachable, and delegates into the
      same workflow used internally. For every documented exception or failure condition,
      map the triggering input state to the exact documented error category instead
      of using generic failures. Pay special attention to externally supplied inputs
      that may require expansion, type inference, retrieval, archive handling, sublocation
      validation, metadata validation, overwrite/reuse prompting, or cleanup. Ensure
      binary/text preservation, path safety, permission preservation, and partial-output
      rollback follow the documented boundary behaviour. Add contract-level checks
      for public reachability, exact error typing, and representative nonlocal/archive/shorthand/invalid
      cases without relying on real external services.
  - kind: add_reviewer
    role: contract_critic
  - kind: template
    template_id: review_then_fix
  - kind: budget
    steps: 2
    seconds: 180

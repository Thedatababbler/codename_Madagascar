- entry_id: G21
  triggers:
  - feature: n_public_symbols
    op: '>='
    value: 1
  - feature: n_focus_files
    op: <=
    value: 3
  predicted_error_classes:
  - E3
  - E6
  - E5
  actions:
  - kind: inventory
    kinds:
    - main_path
    - boundary
    - error_path

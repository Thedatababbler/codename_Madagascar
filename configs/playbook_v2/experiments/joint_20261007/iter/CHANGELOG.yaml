- round: 3
  best_after: F0
  tested:
  - design: G31
    intent: Force the writer to anchor implementation in quoted successful behaviours
      by writing checks for them before coding.
    source:
      based_on: G21
      playbook_row: E3-S1
      residual_cluster: E3
    differs_from_previous: G21 gave the writer main, boundary, and error inventory
      with a checklist but kept an ordinary write-first shape; this design narrows
      the inventory to main-path behaviours and switches to a test-first template
      so the quoted happy paths become concrete checks before implementation. Unlike
      G11 it has no reviewer and no exception-heavy inventory; unlike G22 it does
      not use continuation or state/integration inventory.
    why_now: The latest remaining failures are dominated by main-path misses, and
      the prior inventory result reduced gate failures but did not generalize enough;
      making the writer turn the main-path inventory into checks should reduce superficial
      compliance and catch default, fallback, inference, and ordering omissions before
      the first gate.

# Sandbox isolation and author fake-object fixes (spec pasted 2026-10-09). An experiment yaml may override the
# author block. Sandbox-only rule (2026-10-11): sandbox.enforced is fixed at true; neither an experiment yaml nor
# ADAMAS_SANDBOX_ENFORCED can turn it off (orchestra.sandbox.policy.enforced).
sandbox:
  enforced: true           # fixed (sandbox-only rule, 2026-10-11); a false value makes every run refuse to start
  allow_loopback: true
  allow_external_network: false
  s6_budget_cap: 2
  # user decision 2026-10-15: tasks whose dataset tests hard-code /tmp. Their gate tests (and held-out scoring, which
  # already has free file access) may write /tmp; agents never may. Files matching the globs are removed before and
  # after each run; runs of one task never overlap (orchestra.sandbox.gate_tmp).
  gate_tmp:
    bplustree: ["/tmp/bplustree-testfile*"]
author:
  testkit: true
  fake_object_audit: true
  interface_audit: true      # 2026-10-11: undocumented call / signature mismatch = violation; no soft conversion
  fixture_check: true        # 2026-10-11: --setup-only in the task env before freezing; failures go back to the author
  accommodation_check: true
  train_reference_filter: true
  a4_budget_cap: 4

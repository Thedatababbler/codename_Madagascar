contract_id: codex_realbench_analyst
role: CodexRealBenchAnalyst
system_prompt_template: |
  You are a careful coding agent implementing a RealBench Python repository.
  Stage: ANALYZE / draft.
  Read TASK.md, REQUIREMENTS.md, and public_design/ carefully.
  Write NOTES.md summarizing architecture, modules, and implementation order.
  Create an initial draft implementation matching the UML/package design and
  empty scaffold paths. Prefer completing core packages over unrelated files.
  Do not access parent directories or search for hidden reference implementations.
  Do not create subagents. Each run uses a fresh Codex thread.
user_prompt_template: |
  Task artifacts:
  {artifacts_json}

  Analyze the RealBench project and draft the repository. Write NOTES.md and
  an initial implementation. Do not create subagents.
model: ${CODEX_MODEL:-gpt-5.4}
temperature: 0.0
max_tokens: 8192
timeout_seconds: 1200
allowed_tools: []
input_schema: ProblemArtifact
output_schema: RepositoryChangeArtifact
parser_id: repository_change
memory_scope: local

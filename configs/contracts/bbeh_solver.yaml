contract_id: bbeh_solver
role: problem_solver
system_prompt_template: |
  You are a careful problem-solving agent. Use the available tools when helpful.
  Call final_answer exactly once with ONLY the final answer value
  (for example "E", "131", or "-52"). Do not wrap the answer in JSON, dicts,
  code, or explanations. Do not invent hidden labels.
user_prompt_template: |
  Solve the task represented by these typed artifacts:
  {artifacts_json}

  Return the answer via final_answer(value) where value is the answer alone.

model: ${CODEAGENT_MODEL:-gpt-5-mini}
temperature: 0.2
max_tokens: 4096
timeout_seconds: 300
allowed_tools:
  - python_math
  - calculator
  - final_answer
input_schema: ProblemArtifact
output_schema: FinalAnswerArtifact
parser_id: final_answer
memory_scope: local

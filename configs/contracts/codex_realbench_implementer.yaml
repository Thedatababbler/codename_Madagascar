contract_id: codex_realbench_implementer
role: CodexRealBenchImplementer
system_prompt_template: |
  You are a careful coding agent implementing a RealBench Python repository.
  Stage: IMPLEMENT / harden.
  Read TASK.md, REQUIREMENTS.md, public_design/, and NOTES.md if present.
  Complete packages, classes, functions, and public APIs described by the design.
  Produce a complete, installable Python repository rather than a partial sketch.
  You may run visible local checks in this workspace; hidden evaluation tests are
  not available. Do not access parent directories or search for reference code.
  Do not create subagents. Each run uses a fresh Codex thread.
user_prompt_template: |
  Task artifacts:
  {artifacts_json}

  Harden and complete the RealBench repository implementation. Do not create
  subagents.
model: ${CODEX_MODEL:-gpt-5.4}
temperature: 0.0
max_tokens: 8192
timeout_seconds: 1200
allowed_tools: []
input_schema: ProblemArtifact
output_schema: RepositoryChangeArtifact
parser_id: repository_change
memory_scope: local

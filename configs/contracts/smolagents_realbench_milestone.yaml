contract_id: smolagents_realbench_milestone
role: SmolagentsRealBenchMilestone
system_prompt_template: |
  You are a careful coding agent implementing a RealBench Python repository.
  Your milestone objective, acceptance criteria and a log of what earlier
  milestones already committed are given to you in this conversation.
  Read TASK.md, REQUIREMENTS.md and public_design/ in the workspace.
  You must modify files in the authorized workspace using the provided repository
  tools (list/read/write/apply_workspace_patch). Do not invent a prose patch as
  the deliverable — only real workspace edits count.
  `run_public_check` gives advisory feedback; the scheduler independently re-runs
  the authoritative acceptance check from outside the repository (it imports
  every public module at the path public_design declares and requires
  UML-exported symbols to be importable from that exact module).
  Re-export a package's public surface from its `__init__.py`: consumers import
  from the package path (`from pkg.sub import Thing`), so a subpackage's exported
  names must also be reachable at the parent package.
  Ship only files the public tree describes — notes, plans, scratch directories
  or duplicate package copies are not carried into evaluation, so nothing you
  ship may import them.
  Hidden evaluation tests are not available. Do not access parent directories or
  search for reference implementations. Do not create subagents.
user_prompt_template: |
  Task artifacts:
  {artifacts_json}

  Execute the milestone described above by editing the workspace with repository
  tools, then call final_answer with a short summary.
model: ${SMOLAGENTS_MODEL:-gpt-5-mini}
temperature: 0.0
max_tokens: 8192
timeout_seconds: 1200
allowed_tools:
  - list_workspace_files
  - read_workspace_file
  - write_workspace_file
  - apply_workspace_patch
  - run_public_check
  - final_answer
input_schema: ProblemArtifact
output_schema: RepositoryChangeArtifact
parser_id: repository_change
memory_scope: local

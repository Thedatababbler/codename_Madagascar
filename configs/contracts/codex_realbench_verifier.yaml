contract_id: codex_realbench_verifier
role: CodexRealBenchVerifier
system_prompt_template: |
  You are a careful coding agent finalizing a RealBench Python repository.
  Stage: VERIFY / finalize.
  Re-check TASK.md, REQUIREMENTS.md, and public_design/ against the current code.
  Fix gaps in public API, imports, packaging, and cross-module interfaces.
  Leave the repository in its best working state. Do not access parent directories
  or search for hidden reference implementations.
  Do not create subagents. Each run uses a fresh Codex thread.
user_prompt_template: |
  Task artifacts:
  {artifacts_json}

  Verify and finalize the RealBench repository. Do not create subagents.
model: ${CODEX_MODEL:-gpt-5.4}
temperature: 0.0
max_tokens: 8192
timeout_seconds: 1200
allowed_tools: []
input_schema: ProblemArtifact
output_schema: RepositoryChangeArtifact
parser_id: repository_change
memory_scope: local

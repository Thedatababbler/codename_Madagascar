contract_id: codex_implementer
role: CodexImplementer
system_prompt_template: |
  You are a careful coding agent working inside a Git repository workspace.
  Fix the repository so that all tests pass.
  Make the smallest correct change.
  Run the tests before finishing.
  Do not create subagents.
  Do not invent files outside the workspace.
user_prompt_template: |
  Task artifacts:
  {artifacts_json}

  Fix the repository so that all tests pass.
  Make the smallest correct change.
  Run the tests before finishing.
  Do not create subagents.
model: ${CODEX_MODEL:-gpt-5.4}
temperature: 0.0
max_tokens: 4096
timeout_seconds: 300
allowed_tools: []
input_schema: ProblemArtifact
output_schema: RepositoryChangeArtifact
parser_id: repository_change
memory_scope: local

contract_id: solution_coder
role: SolutionCoder
system_prompt_template: |
  You are an expert Python 3.11 competitive programmer. Follow the combined
  typed plan and produce exactly one complete solution.
  Prefer a single Python code block (```python ... ```).
  Do not include tests or hidden-test assumptions.
  When tools are available, call final_answer exactly once with the full
  solution source (string; a fenced python block is fine).
user_prompt_template: |
  Implement the solution from these typed artifacts:
  {artifacts_json}
model: ${CODER_MODEL:-gpt-5-mini}
temperature: 0.2
max_tokens: 4000
timeout_seconds: 180
allowed_tools: []
input_schema: ArtifactBundle
output_schema: CodeArtifact
parser_id: python_code
memory_scope: local

contract_id: codex_lcb_implementer
role: CodexLCBImplementer
system_prompt_template: |
  You are a careful coding agent in a Git repository for a LiveCodeBench problem.
  Stage: IMPLEMENT / harden.
  Read NOTES.md if present, then harden solution.py so public pytest cases pass
  robustly (board adjacency: same row and |A-B|==1 on the 1..9 numbering).
  Do not edit test_solution.py.
  Run pytest before finishing.
  Do not create subagents.
user_prompt_template: |
  Task artifacts:
  {artifacts_json}

  Harden solution.py for LiveCodeBench abc309_a. Public tests must pass.
  Do not create subagents.
model: ${CODEX_MODEL:-gpt-5.4}
temperature: 0.0
max_tokens: 4096
timeout_seconds: 480
allowed_tools: []
input_schema: ProblemArtifact
output_schema: RepositoryChangeArtifact
parser_id: repository_change
memory_scope: local

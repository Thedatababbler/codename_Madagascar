[project]
name = "adamas-orchestra"
version = "0.1.0"
description = "Stage 1 LiveCodeBench runtime orchestra foundation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.27",
  "numpy>=2.0",
  "orjson>=3.10",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "pyyaml>=6.0",
  "tenacity>=9.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
smolagents = [
    "smolagents[openai]==1.26.0",
]
codex = [
    "openai-codex==0.1.0b3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
# openai-codex and its bundled CLI are currently published as prereleases only.
prerelease = "allow"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

- category_id: FP-RESP-FILTER
  symptom: A network client successfully received the peer's reply, but the value returned to the caller omitted the protocol framing bytes, so it did not match the complete response as sent on the wire.
  cause: The implementation treated the incoming response as a decoded message body and stripped the transport envelope before returning it, while the expected contract was to return the raw framed response bytes after sending a properly framed request.
  lesson: For framed network protocols, distinguish clearly between low-level transport APIs and higher-level message parsers. If the documented client operation represents a wire-level send/receive primitive, it should wrap outgoing payloads with the required frame delimiters and return the complete raw response frame unless the documentation explicitly says to decode or strip framing.
  applies_when:
    domain_tags:
    - network_protocol
    position:
    - middle
  evidence:

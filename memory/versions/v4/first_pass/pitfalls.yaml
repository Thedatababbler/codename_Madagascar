- category_id: FP-RAW-VS-STATUS
  symptom: 'A state-changing message-marker operation returned the wrong kind of result and/or used the wrong protocol variant: the normal form did not expose the updated marker set, while the quiet form did not suppress the response value as expected.'
  cause: The implementation treated related mutating commands too uniformly, ignoring the documented distinction between ordinary operations that return parsed server state and quiet/silent operations that are only acknowledgements. It also needed to construct the protocol command variant consistently with that distinction.
  lesson: 'When an API offers both normal and silent variants of a protocol mutation, implement them as separate semantic cases: the normal variant should send the non-silent protocol command and parse the server''s updated state into the documented return shape, preserving documented byte/string token conventions; the silent variant should send the silent protocol modifier and return no value if the documentation says the operation is quiet.'
  applies_when:
    domain_tags:
    - network_protocol
    position:
    - middle

- category_id: FP-RESP-FILTER
  symptom: A splitter for an aggregate structured-data file returned the file and batch envelope records as separate items instead of returning only the contained logical messages, so the first returned item was metadata rather than a payload message.
  cause: 'The implementation treated every segment-like line as an output unit and did not distinguish envelope/control records from actual message records. It also failed to define the splitter’s output granularity: logical messages, not raw file records.'
  lesson: When implementing utilities for a structured file format that has file-level or batch-level wrappers, make the split operation return the documented logical payload units. Skip header/trailer wrapper records, start a new item at each message header, preserve the message’s internal segment delimiters as expected by the format, and normalize common line-ending variants before splitting. For generated identifiers, enforce the documented shape explicitly, such as fixed length and allowed character set.
  applies_when:
    domain_tags:
    - file_format
    position:
    - middle
  evidence:
    source_records:
    - R-16a9ad7355
    fixes_observed: 1
    milestones_observed: 1

- category_id: FP-TYPE
  symptom: A protocol response containing a nested message metadata block was not returned as the documented structured object; nested address entries, absent optional fields, message identifiers, and parsed date values were missing or left unconverted.
  cause: The initial implementation treated server responses as simple raw tokens or placeholders instead of recursively parsing the protocol grammar and converting the specific metadata block into the documented typed structure. It did not consistently preserve byte-valued fields, map protocol nulls to null optional fields, parse dates, or build nested address objects.
  lesson: When documentation promises structured objects for a protocol response, implement the full conversion contract, not just token collection. Parse nested parenthesized lists, preserve raw protocol text as bytes where the documented fields are byte-valued, convert protocol null markers to null for optional fields, parse documented date fields into date/time objects, validate field counts, and recursively convert nested address lists into the documented element type.
  applies_when:
    domain_tags:
    - network_protocol
    position:
    - middle

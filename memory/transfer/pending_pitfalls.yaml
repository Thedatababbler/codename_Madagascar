- category_id: 'NEW:Persistent metadata initialization and round-trip: Implementations of file-backed formats must explicitly handle absent metadata and must serialize and deserialize all fields needed to reconstruct equivalent metadata across reopen or read operations.'
  symptom: A newly created file-backed store either returned default/partial metadata or failed unpredictably before metadata had been written, and metadata written later did not reliably round-trip all configuration fields.

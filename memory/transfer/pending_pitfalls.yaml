- category_id: 'NEW:STATEFUL-ALLOCATOR-SEMANTICS: APIs that expose the next available identifier, offset, page, or slot must clarify and implement whether reading that value merely reports current state or also reserves/advances allocation state.'
  symptom: Successive requests for a free storage page did not yield consecutive page numbers, so the same slot could be exposed more than once or allocation order could be unstable.
  cause: The implementation treated the free-page value as a passive computation from current persisted state instead of a stateful allocation cursor that advances when a page number is handed out.
  lesson: 'When documentation describes an API as providing the next available storage slot, implement it as a reservation/allocation operation: each successful access should advance internal allocation state so later calls expose the following slot, even before data is written to disk.'

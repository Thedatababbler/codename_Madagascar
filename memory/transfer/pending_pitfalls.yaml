- category_id: 'NEW:ITERATOR-SIDE-EFFECT-CONTRACT: Documentation describes an operation that yields items while also requiring final side effects such as flushing, closing, or deleting resources; implementations must preserve both the yielded data contract and the cleanup semantics when the iterator is consumed.'
  symptom: A storage recovery operation completed without exposing the committed page data expected by callers and/or left its transient recovery file behind after the transfer.
  cause: The implementation did not treat the documented transfer operation as both an iterator over committed page records and a cleanup boundary. It handled persistence state but missed the required observable yield contract and final deletion semantics.

- category_id: 'NEW:PAGE-CAPACITY-SPLIT: Fixed-size page storage structures must enforce serialized page capacity during insertion and splitting, not merely logical item counts or configured order.'
  symptom: Bulk inserting a large ascending dataset with default settings fails during persistence because a node grows beyond the fixed page size instead of being split and written safely.
  cause: The implementation treated the configured branching order as sufficient capacity control, but did not consistently enforce the physical page-size limit or cascade node splits through leaves, internal nodes, and the root before serialization.
  lesson: When documentation promises automatic node splitting and persistent reopening under a default fixed-page configuration, implementers must design insertion around both logical occupancy and serialized byte size. Bulk insertion should create only page-fitting nodes, cascade splits as the tree height grows, update root metadata, and reload records from the reachable tree structure rather than relying on oversized in-memory aggregation.
